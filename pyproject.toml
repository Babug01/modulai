[project]
name = "modulai"
version = "0.1.0"
description = "Give it a resource name, get back a schema-grounded, tested Terraform module."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
google = ["google-genai>=0.3.0"]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
modulai = "modulai.cli:main"
modulai-mcp = "modulai.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modulai"]
